<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | GIMCO Auto &amp; Fuel</title>
  <meta name="description" content="Browse car accessories, truck accessories and automotive tools. Search, filter by price and type, and order for pickup or delivery.">
  <meta name="theme-color" content="#0e0e10">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Shop</span></nav>
        <h1 id="shop-title">Shop all products</h1>
        <p id="shop-subtitle">Accessories, tools and essentials for every car and truck.</p>
      </div>
    </section>

    <section class="section" style="padding-top:40px">
      <div class="container shop-layout">
        <aside class="filters" id="filters" aria-label="Filters">
          <div class="filters__head">
            <h3>Filters</h3>
            <button class="icon-btn" type="button" data-close aria-label="Close filters">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
          <div class="filter-group">
            <h4>Category</h4>
            <div id="filter-category"></div>
          </div>
          <div class="filter-group">
            <h4>Product type</h4>
            <div id="filter-type"></div>
          </div>
          <div class="filter-group">
            <h4>Price</h4>
            <div id="filter-price"></div>
            <div class="price-inputs">
              <input class="input" id="price-min" type="number" min="0" step="1" placeholder="Min $" aria-label="Minimum price">
              <span>–</span>
              <input class="input" id="price-max" type="number" min="0" step="1" placeholder="Max $" aria-label="Maximum price">
            </div>
          </div>
          <button class="btn btn--dark btn--block filters__apply" type="button" data-close>Show results</button>
        </aside>

        <div>
          <div class="toolbar">
            <form class="search" id="search-form" role="search">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input class="input" id="search" type="search" placeholder="Search products, e.g. phone holder, wrench…" aria-label="Search products" autocomplete="off">
            </form>
            <button class="btn btn--outline filter-toggle" id="filter-toggle" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
              Filters <span id="filter-count"></span>
            </button>
            <select class="select" id="sort" aria-label="Sort products">
              <option value="featured">Sort: Recommended</option>
              <option value="newest">Newest</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="name">Name: A–Z</option>
            </select>
          </div>
          <div class="results-info">
            <span id="results-count"></span>
            <div class="chips" id="active-chips"></div>
          </div>
          <div class="product-grid" id="shop-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <!-- Business details: js/config.js · Products & prices: js/products.js -->
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
