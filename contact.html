<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | GIMCO Petroleum</title>
  <meta name="description" content="Call, WhatsApp, email or visit our gas station and automotive shop.">
  <meta name="theme-color" content="#0e0e10">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Contact</span></nav>
        <h1>Contact us</h1>
        <p>Questions about a product, stock or an order? We usually reply within minutes during opening hours.</p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <div class="contact-cards">
          <a class="contact-card" data-bind="whatsapp" target="_blank" rel="noopener">
            <span class="trust__icon trust__icon--wa"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.5 13.8c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.8-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.1.1.3 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.6 2.1 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.1.1.7-.1 1.2Z"/></svg></span>
            <div><strong>WhatsApp</strong><span>Fastest way to reach us</span></div>
          </a>
          <a class="contact-card" data-bind="tel">
            <span class="trust__icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
            <div><strong>Call</strong><span data-bind="phone"></span></div>
          </a>
          <a class="contact-card" data-bind="mailto">
            <span class="trust__icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
            <div><strong>Email</strong><span data-bind="email"></span></div>
          </a>
          <a class="contact-card" data-bind="maplink" target="_blank" rel="noopener">
            <span class="trust__icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
            <div><strong>Visit</strong><span data-bind="address"></span></div>
          </a>
          <div class="contact-card" style="align-items:flex-start">
            <span class="trust__icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
            <div style="flex:1"><strong>Opening hours</strong><div data-bind="hours"></div><span data-bind="hours-note"></span></div>
          </div>
        </div>

        <div>
          <form class="card" id="contact-form">
            <h2>Send us a message</h2>
            <p style="color:var(--gray-500)">Your message opens in WhatsApp or your email app, ready to send.</p>
            <div class="form-grid">
              <div class="field">
                <label for="c-name">Name *</label>
                <input class="input" id="c-name" name="name" required autocomplete="name">
              </div>
              <div class="field">
                <label for="c-phone">Phone *</label>
                <input class="input" id="c-phone" name="phone" type="tel" required autocomplete="tel">
              </div>
              <div class="field field--full">
                <label for="c-message">Message *</label>
                <textarea class="input" id="c-message" name="message" required placeholder="What can we help you with?"></textarea>
              </div>
            </div>
            <div class="submit-row">
              <button class="btn btn--whatsapp btn--lg" type="submit" value="whatsapp"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.5 13.8c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.8-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.1.1.3 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.6 2.1 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.1.1.7-.1 1.2Z"/></svg> Send via WhatsApp</button>
              <button class="btn btn--dark btn--lg" type="submit" value="email">Send by email</button>
            </div>
          </form>
          <div class="map" data-bind="map" style="margin-top:24px"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <!-- Business details: js/config.js · Products & prices: products.csv -->
  <script src="js/config.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
